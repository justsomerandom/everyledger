spring.application.name=everyledger
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
spring.datasource.url=${EVERYLEDGER_DB_URL:jdbc:postgresql://localhost:5432/everyledger}
spring.datasource.username=${EVERYLEDGER_DB_USERNAME:everyledger}
spring.datasource.password=${EVERYLEDGER_DB_PASSWORD:everyledger}
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
